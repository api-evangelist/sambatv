name: SambaTV
description: 'Samba TV is a media and advertising intelligence company that measures
  television and streaming viewership across screens using data collected from millions
  of opted-in smart TVs and connected devices. Its platform gives advertisers, agencies,
  and publishers cross-screen audience targeting, campaign measurement, and content
  analytics built on privacy-first, deterministic viewing signals rather than cookies
  or traditional identifiers. Samba TV operates a gated partner portal (developer.samba.tv,
  which redirects to partner-portal.tvp.samba.tv) for licensed data partners; as of
  this enrichment pass it does not publish an open, public developer API, OpenAPI,
  SDKs, or MCP server.'
